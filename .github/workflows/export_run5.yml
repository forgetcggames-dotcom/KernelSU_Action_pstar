name: Export validated pstar run 7 artifact

on:
  push:
    paths: [.github/workflows/export_run5.yml]

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - name: Download validated Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/8828716407/zip > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          (cd artifact && zip -qr ../AnyKernel3-pstar-stock-ksun-susfs-vermagic.zip .)

      - name: Publish temporary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ksun-stock-modules-run7 \
            AnyKernel3-pstar-stock-ksun-susfs-vermagic.zip \
            artifact/Image \
            --repo "$GITHUB_REPOSITORY" \
            --target Lineage_pstar \
            --title "pstar stock KernelSU Next + SUSFS (Motorola modules compatible)" \
            --notes "Validated GitHub Actions run 30733182325; kernel release 4.19.157-perf+, signature enforcement disabled, and stock Motorola module CRC checks bypassed."
