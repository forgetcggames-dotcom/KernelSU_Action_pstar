name: Export validated pstar run 5 artifact

on:
  push:
    paths: [.github/workflows/export_run5.yml]

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/8828046848/zip > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          (cd artifact && zip -qr ../AnyKernel3-pstar-stock-ksun-susfs-vermagic.zip .)

      - name: Publish temporary release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ksun-stock-vermagic-run5 \
            AnyKernel3-pstar-stock-ksun-susfs-vermagic.zip \
            artifact/Image \
            --repo "$GITHUB_REPOSITORY" \
            --target Lineage_pstar \
            --title "pstar stock KernelSU Next + SUSFS (vermagic compatible)" \
            --notes "Validated GitHub Actions run 30731091390; expected kernel release 4.19.157-perf+."
